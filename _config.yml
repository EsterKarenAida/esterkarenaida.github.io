title: Ester Karen Aida
tagline: Poet, artist, peace activist. Jerusalem.
description: >-
  The poems, artwork and writing of Ester Karen Aida (1967–2022), poet, artist
  and peace activist of Jerusalem.
email: karenboxenhorn@gmail.com
baseurl: ""
domain: esterkarenaida.github.io
url: https://esterkarenaida.github.io
github_username: saaryab

born: 1967
died: 9 August 2022

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  poems:
    output: true
    permalink: /poems/:title.html
    sort_by: title

defaults:
  - scope:
      path: ""
      type: poems
    values:
      layout: poem
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

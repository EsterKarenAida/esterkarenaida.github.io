title: Ester Karen Aida
tagline: Poet, artist, peace activist. Jerusalem.
description: >-
  The poems, artwork and writing of Ester Karen Aida (1967–2022), poet, artist
  and peace activist of Jerusalem.
email: karenboxenhorn@gmail.com
baseurl: ""
domain: esterkarenaida.github.io
url: https://esterkarenaida.github.io
github_username: saaryab

born: 1967
died: 9 August 2022

# Fill in one of these to switch on visit counting. GoatCounter sets no
# cookies and stores no personal data; Google Analytics does both.
analytics:
  goatcounter: "esterkarenaida"
  google_measurement_id: ""

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  poems:
    output: true
    permalink: /poems/:title.html
    sort_by: title
  prose:
    output: true
    permalink: /prose/:title.html
    sort_by: title

defaults:
  - scope:
      path: ""
      type: poems
    values:
      layout: poem
  - scope:
      path: ""
      type: prose
    values:
      layout: prose
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

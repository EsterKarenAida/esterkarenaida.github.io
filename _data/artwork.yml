- group: illuminated
  label: Illuminated pages
  blurb: >
    She illustrated a Friday night siddur page by page, and a Song of Songs she
    also translated. Only a few pages have been photographed so far.
  works:
    - slug: siddur-kabbalat-shabbat-title-page
      title: Kabbalat Shabbat
      medium: Watercolour and ink on paper
      note: Title page of the Friday night siddur she illustrated
    - slug: siddur-shema-roundel
      title: Shema
      medium: Watercolour and pencil
      note: From the same siddur
    - slug: siddur-vayechulu-kiddush-cup
      title: Vayechulu
      medium: Watercolour and gold leaf
      note: The kiddush holding the text, the six days turning around it
    - slug: song-of-songs-page-blue
      title: Shir HaShirim
      medium: Watercolour and ink
      note: From a Song of Songs she illustrated and translated herself
    - slug: song-of-songs-page-gazelle
      title: Shir HaShirim, the gazelle
      medium: Watercolour and ink
    - slug: birkat-habanim
      title: Birkat HaBanim
      medium: Print, numbered 7 of 50
      note: Signed Ester Karen Boxenhorn
    - slug: ketubah-wildflowers
      title: Ketubah
      medium: Watercolour and ink on paper
      note: Made as a wedding gift
    - slug: calligraphy-in-progress
      title: Lettering, unfinished
      medium: Gouache over pencil


# Titles are hers wherever she left one: the names she gave the files in her
# Drive, her Facebook and Redbubble listings, or an inscription on the work.
# The rest are descriptive and marked as such in the archive.

- group: illuminated
  label: Calligraphy and illuminated pages
  blurb: >
    She illustrated the complete Friday night siddur <em>Zimrat Tal</em> page by
    page, and a Song of Songs she also translated. The siddur is
    <a href="/siddur/">here, all fifty pages</a>.
  works:
    - slug: siddur-kabbalat-shabbat-title-page
      title: Kabbalat Shabbat
      note: Title page from Zimrat Tal, the Friday night siddur
    - slug: siddur-vayechulu-kiddush-cup
      title: Vayechulu
      note: The kiddush holding the text, the six days turning around it
    - slug: song-of-songs-page-blue
      title: Shir HaShirim, Shuvi Shulamit
      note: From a Song of Songs she illustrated and translated herself
    - slug: song-of-songs-page-gazelle
      title: Shir HaShirim, the gazelle
    - slug: siddur-shema-roundel
      title: Dodi Li
      medium: Coloured pencil
      note: Song of Songs 2:16, “My beloved is mine and I am his”
    - slug: birkat-habanim
      title: Birkat HaBanim
      medium: Print, numbered 7 of 50
      note: Signed Ester Karen Boxenhorn
    - slug: calligraphy-in-progress
      title: Ner Hashem Nishmat Adam
      note: Proverbs 20:27, “The lamp of God is the soul of man”
    - slug: a-mystery-to-be-loved
      title: A Mystery to Be Loved
      note: “A person coming to you with a problem is not a problem to be solved but a mystery to be loved”
    - slug: ketubah-wildflowers
      title: Ketubah
      note: Made as a wedding gift

